name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg streamlink yt-dlp
      - name: Show Go version
        run: go version
      - name: Verify twitchdl
        run: make verify
